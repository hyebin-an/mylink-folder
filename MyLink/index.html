<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>혜빈의 마이링크 (MyLink)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fdf2f8 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      color: #1e293b;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 36px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .profile-img-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.3);
      font-size: 40px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #0f172a;
    }
    p.bio {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border-radius: 18px;
      background: #ffffff;
      color: #334155;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
      transition: all 0.2s ease;
    }
    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      border-color: #cbd5e1;
      color: #0f172a;
    }
    .link-card.highlight {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .link-card.highlight:hover {
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }
    footer {
      margin-top: 32px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-img-wrap">
      <span>✨</span>
    </div>
    <h1>안혜빈</h1>
    <p class="bio">아이디어를 현실로 만드는 공간 🌿<br>저의 다양한 링크들을 모아둔 마이링크입니다.</p>
    
    <div class="links">
      <a href="https://github.com/hyebin-an" target="_blank" class="link-card highlight">
        💻 GitHub 저장소 (@hyebin-an)
      </a>
      <a href="https://instagram.com" target="_blank" class="link-card">
        📸 Instagram
      </a>
      <a href="https://blog.naver.com" target="_blank" class="link-card">
        📝 Blog & 기록
      </a>
      <a href="mailto:contact@example.com" class="link-card">
        ✉️ Contact Me
      </a>
    </div>

    <footer>
      © 2026 Hyebin Ahn (@hyebin-an). All rights reserved.
    </footer>
  </div>
</body>
</html>
